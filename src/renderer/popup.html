<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ChatMate</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 8px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      }
      .container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 40px);
      }
      .input-area {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      textarea {
        flex: 1;
        margin-bottom: 10px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        resize: none;
        font-size: 14px;
      }
      .button-group {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      select {
        padding: 5px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        padding: 8px 16px;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #1557b0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="input-area">
        <textarea id="input" placeholder="请输入您的问题..."></textarea>
        <div class="button-group">
          <select id="persona">
            <option value="职场精英">职场精英</option>
            <option value="情感专家">情感专家</option>
            <option value="外交官">外交官</option>
            <option value="智者">智者</option>
            <option value="知心朋友">知心朋友</option>
            <option value="幽默达人">幽默达人</option>
            <option value="高情商渣男">高情商渣男</option>
          </select>
          <button id="submit">发送</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
